services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: devforge
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge_local}
    ports:
      - "5432:5432"
    volumes:
      - devforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforge -d devforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devforge-postgres:

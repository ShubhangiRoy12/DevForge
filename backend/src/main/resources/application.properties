spring.application.name=DevForge

spring.datasource.url=${DEVFORGE_DB_URL:jdbc:h2:file:./data/devforge}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DEVFORGE_DB_USERNAME:sa}
spring.datasource.password=${DEVFORGE_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${DEVFORGE_SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${DEVFORGE_SESSION_COOKIE_SECURE:false}
